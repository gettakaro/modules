name: Publish registry

# Each publish asks the Takaro monorepo to open a compatibility-snapshot bump PR (gettakaro/takaro#4630).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Validate registry (append-only against what main published before)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A push compares against the previous tip of main. A manual dispatch (or a push whose previous tip is
          # unknown, such as a first push) compares against the parent of HEAD, so published versions stay immutable.
          BASE="$BEFORE"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}"; then
            BASE=$(git rev-parse --verify --quiet HEAD^ || true)
          fi
          if [ -z "$BASE" ]; then
            npm run registry:check
          else
            npm run registry:check -- --base "$BASE"
          fi
      - name: Assemble site
        run: |
          mkdir _site
          cp -R registry/. _site/
          cp -R schema _site/schema
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Takaro's CI installs every module from a pinned snapshot of this registry. The dispatch makes the
  # monorepo open a snapshot bump PR that runs its compatibility lane (gettakaro/takaro#4630).
  notify-monorepo:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    # The dispatch uses the CI App token, so this job needs none of the workflow's Pages grants.
    permissions: {}
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.TAKARO_CI_APP_ID }}
          private-key: ${{ secrets.TAKARO_CI_APP_PRIV_KEY }}
          owner: gettakaro
          repositories: takaro
      - name: Ask the Takaro monorepo to bump its registry snapshot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api repos/gettakaro/takaro/dispatches -f event_type=module-registry-published
